<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Departamento</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        nav { background: #1a1a2e; padding: 1rem 2rem; display: flex; gap: 2rem; align-items: center; }
        nav a { color: #e0e0e0; text-decoration: none; font-weight: 500; }
        nav a:hover { color: #6c9eff; }
        nav .brand { color: #6c9eff; font-weight: 700; font-size: 1.1rem; margin-right: auto; }
        .container { max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: .4rem; font-weight: 500; font-size: .9rem; color: #555; }
        input { width: 100%; padding: .65rem .9rem; border: 1.5px solid #cdd5e0; border-radius: 6px; font-size: 1rem; }
        input:focus { outline: none; border-color: #6c9eff; }
        .btn-row { display: flex; gap: .75rem; margin-top: 1.5rem; }
        .btn { padding: .6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; font-size: .95rem; font-weight: 500; text-decoration: none; }
        .btn-success { background: #28a745; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
    </style>
</head>
<body>
<nav>
    <span class="brand">🏢 Empresa</span>
    <a th:href="@{/web/departamentos}">Departamentos</a>
    <a th:href="@{/web/empleados}">Empleados</a>
</nav>

<div class="container">
    <div class="card">
        <h1>📁 Nuevo Departamento</h1>
        <form th:action="@{/web/departamentos/nueva}" method="post" th:object="${departamento}">
            <div class="form-group">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej: Recursos Humanos" required/>
            </div>
            <div class="form-group">
                <label for="planta">Planta</label>
                <input type="text" id="planta" th:field="*{planta}" placeholder="Ej: 3ª Planta" required/>
            </div>
            <div class="form-group">
                <label for="presupuesto">Presupuesto (€)</label>
                <input type="number" id="presupuesto" th:field="*{presupuesto}" placeholder="Ej: 150000" step="0.01" min="0" required/>
            </div>
            <div class="btn-row">
                <button type="submit" class="btn btn-success">✔ Guardar</button>
                <a th:href="@{/web/departamentos}" class="btn btn-secondary">✖ Cancelar</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
